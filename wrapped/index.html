<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fantasy Baseball 2026 — Regular Season Wrapped</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Archivo:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F4F7FC;--panel:#FFF;--ink:#0F1B2D;--muted:#66788F;--line:rgba(15,27,45,.13);
 --blue:#2F6BFF;--cyan:#0A9FBF;--magenta:#B8447E;--amber:#D8890A;--violet:#6E4FE8;
 --gold:#D9A320;--acc:var(--blue)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Archivo',system-ui,sans-serif;color:var(--ink);background:#CBD6E6;
 display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:100%;height:100dvh;max-width:820px;overflow:hidden;
 background:linear-gradient(168deg,#FBFCFE 0%,#F1F5FB 45%,#E6EDF7 100%)}
#stage:before{content:"";position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(120% 70% at 50% -12%,color-mix(in srgb,var(--acc) 16%,transparent),transparent 62%)}
body.vid #stage{max-width:none;height:100vh}
#ticks{position:absolute;top:0;left:0;right:0;display:flex;gap:3px;padding:12px 13px 0;z-index:40}
.tick{flex:1;height:3px;background:rgba(15,27,45,.14);border-radius:2px;overflow:hidden}
.tick i{display:block;height:100%;width:0;background:var(--acc)}
.tick.done i,.tick.now i{width:100%}
body.vid #ticks,body.vid #counter,body.vid #hint{display:none}
.slide{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:52px 20px 58px}
body.vid .slide{padding:88px 68px}
.slide.on{display:flex}
.inner{width:100%;transform-origin:center center;text-align:center}
.slide.on .inner>*{animation:pop .42s cubic-bezier(.2,.8,.3,1) backwards}
.slide.on .inner>*:nth-child(2){animation-delay:.05s}.slide.on .inner>*:nth-child(3){animation-delay:.1s}
.slide.on .inner>*:nth-child(4){animation-delay:.15s}.slide.on .inner>*:nth-child(5){animation-delay:.2s}
.slide.on .inner>*:nth-child(6){animation-delay:.25s}
body.still .slide.on .inner>*{animation:none}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{font-family:'DM Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.2em;
 text-transform:uppercase;color:var(--acc);font-weight:500;margin-bottom:11px}
body.vid .eyebrow{font-size:20px;margin-bottom:22px}
h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(34px,9.2vw,62px);line-height:1;letter-spacing:-.03em;text-transform:uppercase}
h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(24px,6.2vw,40px);line-height:1.02;letter-spacing:-.025em;margin-bottom:11px;text-transform:uppercase}
body.vid h1{font-size:94px}body.vid h2{font-size:58px;margin-bottom:20px}
p.body{font-size:clamp(13.5px,3.6vw,16.5px);line-height:1.48;color:#37485E;max-width:38ch;margin-left:auto;margin-right:auto}
body.vid p.body{font-size:28px;max-width:34ch}
.big{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--acc);line-height:.88;
 font-size:clamp(74px,22vw,142px);letter-spacing:-.045em}
body.vid .big{font-size:200px}
.caption{font-family:'DM Mono',ui-monospace,monospace;font-size:11px;letter-spacing:.08em;color:var(--muted);margin-top:7px;text-transform:uppercase}
body.vid .caption{font-size:20px;margin-top:14px}
.lead{text-align:left}
/* ---- universal record block ---- */
.xr{display:inline-flex;gap:0;border:1.5px solid var(--ink);border-radius:7px;overflow:hidden;
 box-shadow:2px 2px 0 rgba(15,27,45,.12);background:var(--panel);margin:0 auto}
.xr .half{padding:6px 12px}
.xr .half+.half{border-left:1.5px solid var(--ink)}
.xr .lb{font-family:'DM Mono',ui-monospace,monospace;font-size:8.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.xr .vv{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;letter-spacing:-.01em;margin-top:1px}
.xr .exp .vv{color:var(--acc)}
.xr .dl .vv.pos{color:var(--cyan)}
.xr .dl .vv.neg{color:var(--magenta)}
body.vid .xr{border-width:2.5px;border-radius:11px}
body.vid .xr .half{padding:12px 24px}body.vid .xr .lb{font-size:16px}body.vid .xr .vv{font-size:36px}
/* ---- cards ---- */
.card{background:var(--panel);border:1.5px solid var(--ink);border-radius:8px;padding:11px;
 box-shadow:3px 3px 0 rgba(15,27,45,.12);margin-top:9px;text-align:left}
body.vid .card{border-width:2.5px;border-radius:13px;padding:22px;box-shadow:6px 6px 0 rgba(15,27,45,.12);margin-top:16px}
.hl{display:flex;align-items:center;gap:9px;margin-top:9px;text-align:left}
.hl .em{font-size:27px;line-height:1;flex:none}
.hl .em.e2{font-size:23px}.hl .em.e3{font-size:19px}
body.vid .hl .em{font-size:52px}body.vid .hl .em.e2{font-size:44px}body.vid .hl .em.e3{font-size:36px}
.hl .card{margin-top:0;flex:1}
.wk{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:6px}
.wk .nm{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px}
.wk .wl{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;color:var(--muted)}
body.vid .wk .nm{font-size:27px}body.vid .wk .wl{font-size:19px}
.prose{font-size:12.5px;line-height:1.45;color:#37485E}
.prose b{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--ink)}
.prose .a{color:var(--acc);font-weight:700}
body.vid .prose{font-size:23px}
/* ---- rows ---- */
.rows{display:flex;flex-direction:column;gap:4px;margin-top:5px;text-align:left}
.rw{display:flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;
 padding:7px 9px;box-shadow:2px 2px 0 rgba(15,27,45,.11)}
body.vid .rw{padding:13px 17px;border-width:2.5px;border-radius:10px;gap:15px;box-shadow:4px 4px 0 rgba(15,27,45,.11)}
.rw .rk{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;color:var(--acc);width:19px;flex:none}
.rw .nm{flex:1;font-weight:600;font-size:12.5px;line-height:1.2}
.rw .vl{font-family:'DM Mono',ui-monospace,monospace;font-size:11.5px;flex:none;white-space:nowrap}
.rw .vb{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;flex:none}
body.vid .rw .rk{font-size:25px;width:40px}body.vid .rw .nm{font-size:24px}
body.vid .rw .vl{font-size:21px}body.vid .rw .vb{font-size:27px}
.pos{color:var(--cyan)}.neg{color:var(--magenta)}
.rw.gold{border-color:var(--gold);box-shadow:2px 2px 0 var(--gold)}
.rw.play{border-color:var(--blue);box-shadow:2px 2px 0 rgba(47,107,255,.4)}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px;
 font-family:'DM Mono',ui-monospace,monospace;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1.5px solid}
.lg-gold i{border-color:var(--gold);background:#FFF6DE}
.lg-blue i{border-color:var(--blue);background:#E7EFFF}
.lg-cut i{border-color:var(--ink);background:#fff}
body.vid .legend{font-size:17px;gap:20px}body.vid .legend i{width:16px;height:16px}
/* ---- category power grid ---- */
.cg{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin-top:4px}
.cgh{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;
 text-align:left;margin-top:9px;border-bottom:2px solid var(--ink);padding-bottom:3px;
 display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.cgh span{font-family:'DM Mono',ui-monospace,monospace;font-size:8px;font-weight:400;
 text-transform:none;color:var(--muted);letter-spacing:0}
body.vid .cgh{font-size:23px}body.vid .cgh span{font-size:15px}
.cc .r{font-size:16px}
.cglg{display:flex;gap:10px;justify-content:flex-start;flex-wrap:wrap;margin:4px 0 6px;text-align:left}
.cglg span{font-family:'DM Mono',ui-monospace,monospace;font-size:8.5px;color:var(--muted);
 background:rgba(15,27,45,.05);border-radius:5px;padding:3px 7px}
.cglg b{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--ink);font-size:10px}
.cgnote{font-family:'DM Mono',ui-monospace,monospace;font-size:8px;color:var(--muted);text-align:left;margin-bottom:4px}
body.vid .cgnote{font-size:15px}
body.vid .cglg span{font-size:16px;padding:6px 13px}body.vid .cglg b{font-size:19px}
.cgl{font-family:'DM Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.16em;text-transform:uppercase;
 color:var(--muted);text-align:left;margin:7px 0 3px}
.cc{background:var(--panel);border:1.5px solid var(--ink);border-radius:6px;padding:5px 2px;text-align:center;
 box-shadow:1.5px 1.5px 0 rgba(15,27,45,.1)}
.cc .c{font-family:'DM Mono',ui-monospace,monospace;font-size:7.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.cc .r{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;line-height:1;margin:1px 0}
.cc .s{font-family:'DM Mono',ui-monospace,monospace;font-size:7.5px;color:var(--muted)}

body.vid .cg{gap:6px}body.vid .cgl{font-size:16px;margin:14px 0 6px}
body.vid .cc{padding:11px 3px;border-width:2.5px;border-radius:10px}
body.vid .cc .c{font-size:14px}body.vid .cc .r{font-size:36px}body.vid .cc .s{font-size:13px}
/* ---- king bars ---- */
.kb{display:flex;align-items:center;gap:7px;margin-bottom:3px;text-align:left}
.kb .c{font-family:'DM Mono',ui-monospace,monospace;font-size:9px;color:var(--muted);width:52px;flex:none;text-transform:uppercase}
.kb .bar{flex:1;height:19px;background:rgba(15,27,45,.07);border-radius:4px;position:relative;overflow:hidden}
.kb .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);opacity:.24}
.kb .bar span{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:600;white-space:nowrap}
.kb .v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:11.5px;color:var(--acc);width:46px;text-align:right;flex:none}
body.vid .kb{gap:13px;margin-bottom:6px}
body.vid .kb .c{font-size:16px;width:96px}body.vid .kb .bar{height:36px}
body.vid .kb .bar span{font-size:19px;left:12px}body.vid .kb .v{font-size:21px;width:88px}
.th{display:flex;align-items:center;gap:8px;margin-bottom:4px;justify-content:center;flex-wrap:wrap}
.place{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12.5px;color:#fff;background:var(--acc);
 border:1.5px solid var(--ink);padding:1px 8px;border-radius:4px}
.rec{font-family:'DM Mono',ui-monospace,monospace;font-size:10.5px;color:var(--muted)}
body.vid .place{font-size:24px;padding:3px 14px;border-width:2.5px}body.vid .rec{font-size:20px}
.tag{display:inline-block;font-family:'DM Mono',ui-monospace,monospace;font-size:9px;letter-spacing:.12em;
 text-transform:uppercase;color:#fff;background:var(--ink);padding:2px 7px;border-radius:3px;margin-bottom:7px}
body.vid .tag{font-size:17px;padding:5px 13px;margin-bottom:14px}

/* slick pill stat table */
.mrow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:5px;
 font-family:'DM Mono',ui-monospace,monospace;font-size:9.5px;color:var(--muted)}
.mrow .res{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;color:var(--ink)}
.mrow .exp{color:var(--acc)}
body.vid .mrow{font-size:18px;gap:14px}body.vid .mrow .res{font-size:23px}
.pt{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:4px}
.pt>div{background:rgba(15,27,45,.045);border-radius:9px;padding:5px 2px;text-align:center}
.pt .k{font-family:'DM Mono',ui-monospace,monospace;font-size:7.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.pt .v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;margin-top:1px;line-height:1.05}
.pt .v em{font-style:normal;font-size:8px;font-weight:700;margin-left:2px;vertical-align:2px}
.mW{color:#1F9D55}.mL{color:#D6337A}.mT{color:#D8890A}
body.vid .pt .v em{font-size:15px;margin-left:4px}
.ptr{display:flex;align-items:center;gap:6px;margin-top:5px}
.ptt{font-family:'DM Mono',ui-monospace,monospace;font-size:8px;letter-spacing:.1em;color:var(--muted);
 text-transform:uppercase;width:26px;flex:none;text-align:left}
.ptr .pt{flex:1;margin-top:0}
body.vid .pt>div{padding:10px 3px;border-radius:14px}
body.vid .pt .k{font-size:14px}body.vid .pt .v{font-size:25px}
body.vid .ptt{font-size:15px;width:52px}
/* king rows */
.ksec{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;text-transform:uppercase;
 letter-spacing:.04em;text-align:left;margin:9px 0 5px;padding-bottom:3px;border-bottom:2px solid var(--ink)}
body.vid .ksec{font-size:25px;margin:18px 0 10px}
.kb3{display:grid;grid-template-columns:42px 1fr 34px 44px 44px;align-items:center;gap:6px;margin-bottom:6px;text-align:left}
.kb3 .c{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:12px;text-transform:uppercase;line-height:1.1}
.kb3 .mid{display:block}
.kb3 .tnrow{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-bottom:1px}
.kb3 .tn{font-size:9.5px;font-weight:600;color:var(--acc)}
.kb3 .tl{font-size:8.5px;font-weight:600;color:var(--magenta);opacity:.8}
body.vid .kb3 .tl{font-size:16px}
.kb3 .strip{display:block;position:relative;height:25px;background:linear-gradient(90deg,
 rgba(52,190,114,.16),rgba(255,201,60,.14) 50%,rgba(214,51,122,.14));border-radius:3px}
.kb3 .strip u{position:absolute;top:3px;width:1.5px;height:9px;background:rgba(15,27,45,.28);text-decoration:none}
.kb3 .strip u.mark{background:rgba(15,27,45,.5);height:11px;top:2px}
.kb3 .strip u.lead{background:var(--acc);width:3px;height:15px;top:0;border-radius:2px}
.kb3 .strip u b{position:absolute;top:11px;left:50%;transform:translateX(-50%);
 font-family:'DM Mono',ui-monospace,monospace;font-size:6.5px;font-weight:400;color:var(--muted);white-space:nowrap}
.kb3 .strip u.lead b{color:var(--acc);font-weight:500;top:14px}
.kb3 .sc{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14px;color:var(--acc);text-align:right}
.kb3 .rc{font-family:'DM Mono',ui-monospace,monospace;font-size:8.5px;color:var(--muted);text-align:right}
.kb3 .xp{color:var(--acc)}
body.vid .kb3{grid-template-columns:104px 1fr 66px 86px 86px;gap:12px;margin-bottom:12px}
body.vid .kb3 .c{font-size:17px}body.vid .kb3 .tn{font-size:18px}
body.vid .kb3 .strip{height:46px}body.vid .kb3 .strip u{height:17px;width:2.5px;top:5px}
body.vid .kb3 .strip u.lead{height:27px;width:5px;top:0}
body.vid .kb3 .strip u.mark{height:20px;top:4px}
body.vid .kb3 .strip u b{font-size:12px;top:22px}
body.vid .kb3 .strip u.lead b{top:28px}
body.vid .kb3 .sc{font-size:26px}body.vid .kb3 .rc{font-size:16px}
.kb2{display:grid;grid-template-columns:52px 1fr 34px 46px 46px;align-items:center;gap:7px;margin-bottom:4px;text-align:left}
.kb2 .c{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:9.5px;color:var(--ink);text-transform:uppercase}
.kb2 .bar{height:21px;background:rgba(15,27,45,.06);border-radius:6px;position:relative;overflow:hidden}
.kb2 .bar i{position:absolute;inset:0 auto 0 0;background:var(--acc);opacity:.18}
.kb2 .bar u{position:absolute;top:0;bottom:0;width:1px;background:rgba(15,27,45,.16)}
.kb2 .bar b{position:absolute;top:-2px;bottom:-2px;width:2.5px;background:var(--acc);border-radius:2px}
.dl{display:flex;flex-direction:column;gap:2px}
.dr{display:grid;grid-template-columns:1fr auto 1fr;align-items:baseline;gap:8px;padding:4px 8px;
 border-bottom:1px solid rgba(15,27,45,.1)}
.dr .c{font-family:'DM Mono',ui-monospace,monospace;font-size:9px;text-transform:uppercase;
 color:var(--muted);letter-spacing:.06em;text-align:left}
.dr .v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:var(--acc);text-align:center}
.dr.bad .v{color:var(--magenta)}
.dr .w{font-size:9.5px;font-weight:600;text-align:right;line-height:1.15}
.dr .w em{font-style:normal;display:block;font-family:'DM Mono',ui-monospace,monospace;
 font-weight:400;font-size:8px;color:var(--muted)}
body.vid .dr{padding:9px 14px;gap:16px}
body.vid .dr .c{font-size:17px}body.vid .dr .v{font-size:35px}
body.vid .dr .w{font-size:18px}body.vid .dr .w em{font-size:15px}
.dg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.dc{background:var(--panel);border:1.5px solid var(--ink);border-radius:8px;padding:6px 4px;text-align:center;
 box-shadow:2px 2px 0 rgba(15,27,45,.11)}
.dc .c{font-family:'DM Mono',ui-monospace,monospace;font-size:7.5px;color:var(--muted);text-transform:uppercase}
.dc .v{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;color:var(--acc);line-height:1.05;margin:1px 0}
.dc .w{font-family:'DM Mono',ui-monospace,monospace;font-size:7.5px;color:var(--muted);line-height:1.25}
.dc .w em{font-style:normal;color:var(--amber);display:block}
body.vid .dg{gap:10px}body.vid .dc{padding:14px 8px;border-width:2.5px;border-radius:13px}
body.vid .dc .c{font-size:14px}body.vid .dc .v{font-size:36px}body.vid .dc .w{font-size:14px}
.khead{display:grid;grid-template-columns:42px 1fr 34px 44px 44px;gap:6px;text-align:right;
 font-family:'DM Mono',ui-monospace,monospace;font-size:7.5px;letter-spacing:.06em;
 text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.khead span:nth-child(2){text-align:left}
.kb2 .xp{color:var(--acc)}
body.vid .khead{grid-template-columns:104px 1fr 66px 86px 86px;gap:12px;font-size:14px}
.kb2 .bar span{position:absolute;left:7px;top:50%;transform:translateY(-50%);font-size:10.5px;font-weight:600;white-space:nowrap}
.kb2 .sc{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--acc);text-align:right;width:38px}
.kb2 .rc{font-family:'DM Mono',ui-monospace,monospace;font-size:9px;color:var(--muted);text-align:right}
body.vid .kb2{grid-template-columns:104px 1fr 66px 90px 90px;gap:14px;margin-bottom:8px}
body.vid .kb2 .c{font-size:18px}body.vid .kb2 .bar{height:40px}
body.vid .kb2 .bar span{font-size:20px;left:14px}body.vid .kb2 .sc{font-size:28px;width:72px}
body.vid .kb2 .rc{font-size:17px}
/* schedule luck comparison */
.lk{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:9px;background:var(--panel);
 border:1.5px solid var(--ink);border-radius:8px;padding:7px 10px;box-shadow:2px 2px 0 rgba(15,27,45,.11);margin-bottom:4px;text-align:left}
.lk .nm{font-weight:600;font-size:12.5px}
.lk .pair{display:flex;flex-direction:column;gap:1px;text-align:right}
.lk .pair span{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;color:var(--muted);white-space:nowrap}
.lk .pair span b{font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--ink);font-size:11.5px}
.lk .d{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:17px;width:52px;text-align:right}
body.vid .lk{padding:14px 20px;border-width:2.5px;gap:18px}
body.vid .lk .nm{font-size:24px}body.vid .lk .pair span{font-size:19px}

/* two-column personal head */

 "SB", "AVG", "OPS"], "pit": ["W", "SV", "K", "ERA", "WHIP", "QS"], "cats": ["R", "HR", "RBI", "SB", "AVG", "OPS", "W", "SV", "K", "ERA", "WHIP", "QS"], "blurbs": {"I think Yammamoto likes you": ["BEST RECORD IN THE LEAGUE", "Ran away with it. Finished #1 in the league in saves (3.09), WHIP (3.66), homers (4.18) and RBI (4.3) \u2014 four categories outright. The one soft spot was strikeouts at #9, and it never once mattered."], "South Side Samurai": ["THE MOST HONEST TEAM", "Second place with the most deserved record in the league: expected and actual wins landed 0.4 apart. Also the streakiest team in the league week to week. Batting average was a real problem \u2014 dead last at 6.39 \u2014 and they won anyway."], "CHUZZ HOME": ["STARTED LAST, FINISHED THIRD", "Opened the season ranked dead last in the league, then finished with 5 weeks at #1 \u2014 more than anybody. That 2.73 in steals is the tightest grip any team had on any category all season. Saves were the hole, at #8."], "The Green Monsters": ["THE TIE MERCHANT", "Twenty-three tied categories, tied for most in the league, and those half-wins lifted them three whole seeds. #1 in the league in OPS (4.36) and runs (4.77). The ERA was dead last at 6.68, and somehow it never caught up with them."], "Team Bruno": ["ROBBED BY THE SCHEDULE", "Lost 12.4 wins to matchup luck alone, worst in the league by a distance. #2 in strikeouts and #3 in saves, with 4 weeks ranked first overall \u2014 and a fifth-place finish for the trouble."], "Pete Malonso - White Iverson": ["MOST IMPROVED AT RENAMING", "#1 in the league in batting average (4.32). Also ranked first overall in 1 week and dead last in 5 \u2014 the second-most volatile team in the league. Changed the team name five separate times, which is more identities than playoff wins."], "Big Dumpers": ["OWNER OF THE BEST WEEK", "Week 4 was the single best week anybody posted all season, and it turned into an 11-0-1 near-sweep. #2 in steals and #2 in saves. Picked up 8.7 free wins from a kind schedule, second-most in the league."], "Elly De La Snooze": ["FEAST OR FAMINE", "Ranked first overall exactly once all season, and dead last 3 times \u2014 and still produced one of only two near-sweeps anybody managed. Twenty-three ties, tied for the league lead. Best category was saves at #5, which tells you plenty."], "Kyle Schwarbomb": ["BEST ERA, WORST EVERYTHING ELSE", "#1 in the league in ERA (3.73) and #2 in WHIP. Also 9.09 in strikeouts \u2014 dead last, close to it every single week. The only team that never once ranked first overall in any week. Great arms, as long as nobody had to miss a bat."], "Woo Back Wednesday": ["THE FUNNIEST STAT OF THE SEASON", "Finished dead last while ranking #1 in the league in strikeouts (3.34), quality starts (3.7) AND wins (3.77). The best pitching staff in the league bolted to the worst record in the league. Saves were last at 7.89."]}, "tags": {"I think Yammamoto likes you": ["Fear Me", "Best record in the league"], "South Side Samurai": ["Honesty is the Best Policy", "Expected and actual wins only 0.4 apart"], "CHUZZ HOME": ["Cleveland Cavaliers", "Won the analytical championship"], "The Green Monsters": ["Marshawn Lynch", "I'm just here so I don't get fined"], "Team Bruno": ["Better Luck Next Time", "Lost 12.4 wins to the schedule, the most in the league."], "Pete Malonso - White Iverson": ["The Trade Machine", "\"Made CHUZZ HOME's Team\""], "Big Dumpers": ["The Biggest Dumper", "Ouch."], "Elly De La Snooze": ["Lost Season", "Great team name"], "Kyle Schwarbomb": ["Nightmares", "You won ERA!"], "Woo Back Wednesday": ["Zoinks Scoob!", "You lost. Game over."]}, "summary": {"R": 7465, "HR": 2070, "RBI": 6967, "SB": 1109, "K": 13629, "W": 855, "SV": 545, "QS": 970, "ties": 88, "deadlocks": 9, "blowouts": 12, "near": 2, "shutouts": 2, "leadChanges": 6, "leaders": 5, "bestCat": "18-0-4", "bestCatWho": "I think Yammamoto likes you", "bestCatC": "SV", "matchups": 110, "teamWeeks": 220}, "imgs": {"I think Y const VID=new URLSearchParams(location.search).has('vid');
const STILL=new URLSearchParams(location.search).has('still');
if(VID)document.body.classList.add('vid');
if(STILL)document.body.classList.add('still');
const f1=v=>Number(v).toFixed(1);


// universal expected/actual record block
function xr(exp,act,showDelta){
  const d=act.w-exp.w, sign=d>0?'+':'';
  const dcol=showDelta?`<div class="half dl"><div class="lb">Delta</div>
    <div class="vv ${d>0?'pos':'neg'}">${sign}${f1(d)}</div></div>`:'';
  return `<div class="xr"><div class="half exp"><div class="lb">Expected</div>
    <div class="vv">${f1(exp.w)}-${f1(exp.l)}-${f1(exp.t)}</div></div>
   <div class="half"><div class="lb">Actual</div><div class="vv">${act.w}-${act.l}-${act.t}</div></div>${dcol}</div>`;
}
function ordinal(n){return n+({1:'st',2:'nd',3:'rd'}[n%100>10&&n%100<20?0:n%10]||'th')}

// season flow with placement callouts
function rankColor(r){
  const t=(r-1)/9;               // 0 best -> 1 worst
  const h=(1-t)*128;             // 128 green -> 0 red
  return {bg:`hsl(${h} 62% 92%)`,bd:`hsl(${h} 55% 42%)`,fg:`hsl(${h} 62% 27%)`};
}
function flow(r){
  const n=r.length,W=680,H=196,PL=26,PR=26,PT=16,PB=30;
  const x=i=>PL+i*(W-PL-PR)/(n-1), y=v=>PT+(v-1)*(H-PT-PB)/9;
  const p=r.map((v,i)=>[x(i),y(v)]);
  const line=p.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  let g='';[1,5,10].forEach(v=>{g+=`<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}"
    stroke="rgba(15,27,45,.13)" stroke-width="1"/>
    <text x="${PL-7}" y="${y(v)+4}" text-anchor="end" font-family="DM Mono,monospace" font-size="10" fill="#66788F">${v}</text>`});
  const dots=p.map((q,i)=>{const v=r[i],k=rankColor(v);
    return `<g><circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="9" fill="${k.bg}" stroke="${k.bd}" stroke-width="1.6"/>
      <text x="${q[0].toFixed(1)}" y="${(q[1]+3.3).toFixed(1)}" text-anchor="middle"
      font-family="Space Grotesk,sans-serif" font-weight="700" font-size="10" fill="${k.fg}">${v}</text></g>`}).join('');
  return `<div class="flow"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Placement each week, 1st is best">${g}
    <path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round" opacity=".5"/>
    ${dots}
    <text x="${PL}" y="${H-8}" font-family="DM Mono,monospace" font-size="10" fill="#66788F">WEEK 1</text>
    <text x="${W/2}" y="${H-8}" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#66788F">WHERE YOU PLACED EACH WEEK</text>
    <text x="${W-PR}" y="${H-8}" text-anchor="end" font-family="DM Mono,monospace" font-size="10" fill="#66788F">WEEK 22</text>
    </svg></div>`;
}
// per-team category power grid
function cgrid(t){
  const cell=c=>{const r=t.catRank[c],k=rankColor(r);
    return `<div class="cc" style="background:${k.bg};border-color:${k.bd}">
      <div class="c">${c}</div><div class="r" style="color:${k.fg}">${ordinal(r)}</div>
      <div class="s">${t.catScore[c]}</div></div>`};
  const eg=ordinal(t.catRank.R), egs=t.catScore.R;
  return `<div class="cgh">Power Score</div>
    <div class="cglg"><span><b>${eg}</b> bigger number &mdash; your place in the league</span>
      <span><b>${egs}</b> smaller number &mdash; your average weekly place, out of 10 (Power Score)</span></div>
    <div class="cgl">Bats</div><div class="cg">${D.hit.map(cell).join('')}</div>
    <div class="cgl">Arms</div><div class="cg">${D.pit.map(cell).join('')}</div>`;
}
function ptable(st,mk){
  const row=(keys,tag)=>`<div class="ptr"><span class="ptt">${tag}</span><div class="pt">${keys.map(k=>{
    const m=mk?`<em class="m${mk[k]}">${mk[k]}</em>`:'';
    return `<div><div class="k">${k}</div><div class="v">${st[k]}${m}</div></div>`}).join('')}</div></div>`;
  return row(D.hit,'Bats')+row(D.pit,'Arms');
}
function track(prog,id){
  const n=prog.length,W=680,H=138,PL=26,PR=26,PT=16,PB=26;
  const x=i=>PL+i*(W-PL-PR)/(n-1), y=v=>PT+(v-1)*(H-PT-PB)/9;
  const pts=prog.map((v,i)=>[x(i),y(v)]);
  const line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  let g='';[1,5,10].forEach(v=>{g+=`<line x1="${PL}" y1="${y(v)}" x2="${W-PR}" y2="${y(v)}"
    stroke="rgba(15,27,45,.13)" stroke-width="1"/>
    <text x="${PL-7}" y="${y(v)+4}" text-anchor="end" font-family="DM Mono,monospace" font-size="10" fill="#66788F">${v}</text>`});
  const marks=prog.map((v,i)=>i===0||i===n-1||v!==prog[i-1]);
  const dots=pts.map((q,i)=>{
    if(!marks[i]) return `<circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="2.6" fill="#fff"
      stroke="var(--acc)" stroke-width="1.4"/>`;
    const last=i===n-1;
    return `<g><circle cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="8.5"
      fill="${last?'var(--acc)':'#fff'}" stroke="var(--acc)" stroke-width="1.8"/>
      <text x="${q[0].toFixed(1)}" y="${(q[1]+3.3).toFixed(1)}" text-anchor="middle"
      font-family="Space Grotesk,sans-serif" font-weight="700" font-size="9.5"
      fill="${last?'#fff':'var(--acc)'}">${prog[i]}</text></g>`}).join('');
  return `<div class="trk"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img"
    aria-label="Standings position each week, finished ${ordinal(prog[n-1])}">${g}
    <path d="${line}" fill="none" stroke="var(--acc)" stroke-width="2.2" stroke-linejoin="round"/>
    ${dots}
    <text x="${PL}" y="${H-7}" font-family="DM Mono,monospace" font-size="10" fill="#66788F">WEEK 1</text>
    <text x="${W/2}" y="${H-7}" text-anchor="middle" font-family="DM Mono,monospace" font-size="10" fill="#66788F">STANDINGS POSITION EACH WEEK</text>
    <text x="${W-PR}" y="${H-7}" text-anchor="end" font-family="DM Mono,monospace" font-size="10" fill="#66788F">WEEK 22</text>
    </svg></div>`;
}
function rows(items){return `<div class="rows">${items.map(it=>
 `<div class="rw ${it.cls||''}">${it.rk!==undefined?`<span class="rk">${it.rk}</span>`:''}
  <span class="nm">${it.nm}</span><span class="${it.big?'vb':'vl'}">${it.vl}</span></div>`).join('')}</div>`}

const slidesEl=document.getElementById('slides');
slidesEl.innerHTML=S.map(([acc,h],i)=>`<section class="slide" id="s${i}" style="--acc:var(--${acc})"><div class="inner">${h}</div></section>`).join('');
const ticksEl=document.getElementById('ticks');
ticksEl.innerHTML=S.map(()=>`<div class="tick"><i></i></div>`).join('');
const counter=document.getElementById('counter'),hint=document.getElementById('hint');
let cur=-1;
function fit(el){
  const inner=el.querySelector('.inner');inner.style.transform='none';
  const cs=getComputedStyle(el);
  const aH=el.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-6;
  const aW=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-4;
  const k=Math.min(1,aH/inner.scrollHeight,aW/inner.scrollWidth);
  if(k<1)inner.style.transform='scale('+k.toFixed(4)+')';
}
function go(n){
  if(n<0||n>=S.length)return;
  if(cur>=0)document.getElementById('s'+cur).classList.remove('on');
  cur=n;const el=document.getElementById('s'+cur);
  el.classList.remove('on');void el.offsetWidth;el.classList.add('on');fit(el);
  document.getElementById('stage').style.setProperty('--acc',getComputedStyle(el).getPropertyValue('--acc'));
  [...ticksEl.children].forEach((t,i)=>{t.classList.toggle('done',i<cur);t.classList.toggle('now',i===cur)});
  counter.textContent=(cur+1)+' / '+S.length;hint.style.opacity=cur===0?'1':'0';
}
window.addEventListener('resize',()=>{if(cur>=0)fit(document.getElementById('s'+cur))});
document.fonts&&document.fonts.ready.then(()=>{if(cur>=0)fit(document.getElementById('s'+cur))});
document.getElementById('nextZ').onclick=()=>go(cur+1);
document.getElementById('prevZ').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1)}
 if(e.key==='ArrowLeft')go(cur-1)});
let tx=0;const st=document.getElementById('stage');
st.addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX},{passive:true});
st.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;
 if(Math.abs(dx)>52)go(dx<0?cur+1:cur-1)},{passive:true});
go(0);
</script></body></html>
